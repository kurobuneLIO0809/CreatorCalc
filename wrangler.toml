# Cloudflare Pages configuration (used by Git-connected builds and `npx wrangler pages deploy`).
# Build command: npm run build   ·   Output directory: dist
#
# Build-time variables (SITE_URL, CF_WEB_ANALYTICS, PRODUCTION_BRANCH) must be set in the
# Cloudflare dashboard: Workers & Pages → <project> → Settings → Variables and Secrets.
# See .env.example and README.md.
name = "quickconvert"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"
